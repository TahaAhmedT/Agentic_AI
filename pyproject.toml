
[project]
name = "agentic-ai"
version = "0.1.0"
description = "Shared Python environment for Agentic AI Course"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.12",
    "mcp>=1.30.0",
    "pymupdf>=2.0",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
    "typesense>=2.1.1",
]

[tool.uv]
package = false
